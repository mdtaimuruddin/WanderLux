<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Request a travel planning appointment with WanderLux.">
    <title>Appointment | WanderLux</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="site-nav" aria-label="Main navigation"><a class="brand" href="index.html">Wander<span>Lux</span></a>
        <div class="nav-links"><a href="index.html">Home</a><a href="destinations.html">Services</a><a
                href="calculator.html">Trip calculator</a><a aria-current="page" href="appointment.html">Appointment</a>
            <a href="about.html">About</a><a href="contact.html">Contact</a>
        </div>
    </nav>
    <header class="page-header">
        <p class="eyebrow">A little time well spent</p>
        <h1>Let's make a plan.</h1>
        <p>Share a few details and a consultant will be in touch within one business day.</p>
    </header>
    <main class="container narrow fade-in">
        <form id="appointment-form" novalidate>
            <div class="form-grid">
                <div><label for="name">Name</label>
                    <input id="name" name="name" autocomplete="name" required>
                </div>
                <div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"
                        required></div>
                <div><label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel"
                        required></div>
                <div><label for="date">Preferred date</label><input id="date" name="date" type="date" required></div>
            </div><label for="message">Tell us about the trip</label><textarea id="message" name="message" rows="6"
                placeholder="Where are you thinking about going?" required></textarea><button class="button"
                type="submit">Request appointment</button>
            <p class="form-message" id="appointment-message" role="status"></p>
        </form>
    </main>
    <footer><strong>WanderLux</strong> · Independent travel planning since 2008</footer>
    <script src="script.js"></script>
</body>

</html>
